<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>ICD 코딩 근거 검토</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 배치: 위에 파이프라인 세 단계 띠, 왼쪽에 노트 원문(근거 강조), 오른쪽에 검토 패널 */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --ink: #17211f;
  --muted: #586764;
  --line: #d3dbd8;
  --chip: #e6edea;
  --accent: #0b6a60;
  --accent-ink: #ffffff;
  --mark: #fdeaa6;
  --mark-on: #f5b13c;
  --ok: #1c7340;
  --ok-bg: #e2f2e7;
  --no: #a3302a;
  --no-bg: #f8e5e3;
  --warn: #7d5200;
  --warn-bg: #fbefd0;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111615; --surface: #1a2120; --ink: #e5ebe9; --muted: #9aa8a4; --line: #2d3836; --chip: #232d2b;
    --accent: #56c7b7; --accent-ink: #06211d; --mark: #574813; --mark-on: #a36f0c;
    --ok: #72d398; --ok-bg: #163423; --no: #f08c84; --no-bg: #3a1c1a; --warn: #f0c56c; --warn-bg: #3a2e10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111615; --surface: #1a2120; --ink: #e5ebe9; --muted: #9aa8a4; --line: #2d3836; --chip: #232d2b;
  --accent: #56c7b7; --accent-ink: #06211d; --mark: #574813; --mark-on: #a36f0c;
  --ok: #72d398; --ok-bg: #163423; --no: #f08c84; --no-bg: #3a1c1a; --warn: #f0c56c; --warn-bg: #3a2e10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.55; }
.app {
  max-width: 1280px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
  display: flex; flex-direction: column; gap: 16px;
}
h1, h2, h3, p, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.lede { color: var(--muted); max-width: 62ch; }
.ex-pick { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.ex-buttons { display: flex; flex-wrap: wrap; gap: 4px; }
.ex-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.ex-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.top-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.lang-switch { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px; gap: 2px; }
.top-tools .divider { width: 1px; align-self: stretch; background: var(--line); }
.lang-opt { border-radius: 4px; padding: 2px 9px; font-size: 12.5px; line-height: 1.6; color: var(--muted); text-decoration: none; }
.lang-opt:hover { color: var(--ink); background: var(--chip); }
.lang-opt[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
.banner { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 13.5px; }

.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stage-name { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
.stage-main { font-weight: 600; font-variant-numeric: tabular-nums; }
.stage-sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

.cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.panel-head { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
h2 { font-size: 15px; font-weight: 600; }
.src { font-size: 12.5px; color: var(--muted); }
.note-panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.note-body {
  padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: calc(100vh - 150px); overflow: auto; font-size: 14.5px; line-height: 1.7;
}
.legend { padding: 8px 16px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.swatch { display: inline-block; width: 22px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: baseline; }
.swatch.m1 { background: var(--mark); }
.swatch.m2 { background: var(--mark-on); }
mark.ev { background: var(--mark); color: inherit; border-radius: 2px; cursor: pointer; padding: 1px 0; }
mark.ev.dim { background: transparent; box-shadow: inset 0 -2px 0 var(--mark); }
mark.ev.on { background: var(--mark-on); }

.tabs { display: flex; gap: 4px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tab { background: transparent; border: 0; border-bottom: 2px solid transparent; padding: 8px 10px; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.view { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--surface); }
.card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.accepted { background: var(--ok-bg); }
.card.rejected { background: var(--no-bg); }
.card.rejected .code-title { text-decoration: line-through; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; background: transparent; border: 0; padding: 0; text-align: left; width: 100%; }
.code { font-family: var(--font-mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.code-title { flex: 1 1 12ch; min-width: 0; }
.chip { display: inline-block; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.no { background: var(--no-bg); color: var(--no); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.meta { font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 500; }
.quotes { display: flex; flex-direction: column; gap: 4px; }
.quote { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; border: 0; background: transparent; padding: 3px 0 3px 10px; border-left: 3px solid var(--mark-on); text-align: left; font-size: 13.5px; }
.quote.unlinked { border-left-color: var(--line); cursor: default; }
.quote-text { min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; font-size: 13.5px; }
.btn[aria-pressed="true"].accept { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn[aria-pressed="true"].reject { background: var(--no); border-color: var(--no); color: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.link { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 4px; }
.alts { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.alts-title { font-size: 12.5px; color: var(--muted); }
.cand-list { display: flex; flex-direction: column; gap: 2px; }
.cand { display: grid; grid-template-columns: 1.6em 7.5em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13.5px; }
.cand .rank { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.cand .ccode { font-family: var(--font-mono); }
.cand .ctitle { min-width: 0; overflow-wrap: anywhere; }
.cand.picked .ccode, .cand.picked .ctitle { font-weight: 600; }

.summary { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; font-variant-numeric: tabular-nums; }
.spacer { flex: 1 1 0; }
.copy-status { font-size: 12.5px; color: var(--muted); order: 3; flex: 1 0 100%; text-align: right; }
.copy-status:empty { display: none; }
#copy-fallback { order: 4; }
#copy-fallback { width: 100%; min-height: 90px; font-family: var(--font-mono); font-size: 12.5px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.foot { font-size: 12.5px; color: var(--muted); }
.foot a { color: var(--accent); }

@media (max-width: 860px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .note-panel { position: static; }
  .note-body { max-height: 46vh; }
  .stages { grid-template-columns: minmax(0, 1fr); }
  .cand { grid-template-columns: 1.6em minmax(0, 1fr) auto; }
  .cand .rank { grid-column: 1; grid-row: 1; }
  .cand .ccode { grid-column: 2; grid-row: 1; }
  .cand .ctitle { grid-column: 2 / 4; grid-row: 2; }
  .cand > :last-child { grid-column: 3; grid-row: 1; justify-self: end; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="top-row">
      <h1>ICD 코딩 근거 검토</h1>
      <div class="top-tools">
        <div class="ex-pick" role="group" aria-label="예시 노트"><span>예시 노트</span><span class="ex-buttons" id="example-buttons"></span></div>
        <span class="divider" aria-hidden="true"></span>
        <nav class="lang-switch" aria-label="언어">
          <a class="lang-opt" href="/" hreflang="ko" lang="ko" aria-current="true">한국어</a>
          <a class="lang-opt" href="/index_en.html" hreflang="en" lang="en">EN</a>
        </nav>
      </div>
    </div>
    <p class="lede">모델이 제안한 ICD-10-CM 코드를 노트 원문의 근거와 나란히 보고, 수락하거나 제외하거나 다른 후보로 바꿉니다.</p>
    <p class="banner" id="mock-banner" hidden>이 예시의 추출 개념, 후보, 제안 코드는 화면 구성을 보여주려고 손으로 만든 것입니다. 실제 파이프라인 출력이 아닙니다.</p>
    <ol class="stages" id="stages"></ol>
  </header>

  <main class="cols">
    <section class="panel note-panel" aria-label="노트 원문">
      <div class="panel-head">
        <h2 id="note-title">노트</h2>
        <p class="src" id="note-source"></p>
      </div>
      <div class="note-body" id="note-body" tabindex="0"></div>
      <p class="legend">
        <span><span class="swatch m1"></span>근거로 인용된 구간</span>
        <span><span class="swatch m2"></span>지금 선택한 코드의 근거</span>
        <span>강조된 구간을 누르면 해당 코드로 이동합니다.</span>
      </p>
    </section>

    <section class="panel review-panel" aria-label="코드 검토">
      <div class="tabs" role="tablist" aria-label="보기 선택">
        <button class="tab" role="tab" id="tab-codes" aria-controls="view-codes" aria-selected="true">제안 코드</button>
        <button class="tab" role="tab" id="tab-items" aria-controls="view-items" aria-selected="false">추출 개념과 후보</button>
      </div>
      <div class="view" id="view-codes" role="tabpanel" aria-labelledby="tab-codes"></div>
      <div class="view" id="view-items" role="tabpanel" aria-labelledby="tab-items" hidden></div>
      <div class="summary">
        <div class="counts" id="counts"></div>
        <span class="spacer"></span>
        <span class="copy-status" id="copy-status" role="status" aria-live="polite"></span>
        <button class="btn" id="reset-btn" type="button">검토 초기화</button>
        <button class="btn primary" id="copy-btn" type="button">수락한 코드 복사</button>
        <textarea id="copy-fallback" readonly hidden aria-label="수락한 코드 목록"></textarea>
      </div>
    </section>
  </main>

  <p class="foot" id="foot"></p>
</div>

NT ILLNESS\n\nMartha Collins is a 50-year-old female with a past medical history significant for congestive heart failure, depression, and hypertension who presents for her annual exam. It has been a year since I last saw the patient.\n\nThe patient has been traveling a lot recently since things have gotten a bit better. She reports that she got her COVID-19 vaccine so she feels safer about traveling. She has been doing a lot of hiking.\n\nShe reports that she is staying active. She has continued watching her diet and she is doing well with that. The patient states that she is avoiding salty foods that she likes to eat. She has continued utilizing her medications. The patient denies any chest pain, shortness of breath, or swelling in her legs.\n\nRegarding her depression, she reports that she has been going to therapy every week for the past year. This has been really helpful for her. She denies suicidal or homicidal ideation.\n\nThe patient reports that she is still forgetting to take her blood pressure medication. She has noticed that when work gets more stressful, her blood pressure goes up. She reports that work has been going okay, but it has been a lot of long hours lately.\n\nShe endorses some nasal congestion from some of the fall allergies. She denies any other symptoms of nausea, vomiting, abdominal pain.\n\nREVIEW OF SYSTEMS\n\n• Ears, Nose, Mouth and Throat: Endorses nasal congestion from allergies.\n• Cardiovascular: Denies chest pain or dyspnea on exertion.\n• Respiratory: Denies shortness of breath.\n• Gastrointestinal: Denies abdominal pain, nausea, or vomiting.\n• Psychiatric: Endorses depression. Denies suicidal or homicidal ideations.\n\nPHYSICAL EXAMINATION\n\n• Cardiovascular: Grade 3/6 systolic ejection murmur.\n1+ pitting edema of the bilateral lower extremities.\n\nVITALS REVIEWED\n\n• Blood Pressure: Elevated.\n\nRESULTS\n\nEchocardiogram demonstrates decreased ejection fraction of 45%. Mitral regurgitation is present.\n\nLipid panel: Elevat <script>
(function () {
  'use strict';

  var EXAMPLES = window.ICD_EXAMPLES || [];
  var TAG_LABEL = { negated: '부정', uncertain: '불확실', history: '과거력', family_history: '가족력' };
  var state = { ex: null, active: null, decisions: {}, added: [], view: 'codes', openAlt: {} };

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = text; }
    return e;
  }
  function reduceMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function storeKey() { return 'icd-review:' + state.ex.id; }
  function save() {
    try {
      window.localStorage.setItem(storeKey(), JSON.stringify({ decisions: state.decisions, added: state.added }));
    } catch (e) { /* 저장이 안 되어도 화면은 그대로 동작한다 */ }
  }
  function load() {
    try {
      var raw = window.localStorage.getItem(storeKey());
      if (!raw) { return; }
      var obj = JSON.parse(raw);
      if (obj && typeof obj === 'object') {
        state.decisions = obj.decisions && typeof obj.decisions === 'object' ? obj.decisions : {};
        state.added = Array.isArray(obj.added) ? obj.added : [];
      }
    } catch (e) { state.decisions = {}; state.added = []; }
  }

  function itemById(id) {
    var items = state.ex.items;
    for (var i = 0; i < items.length; i++) { if (items[i].id === id) { return items[i]; } }
    return null;
  }
  function allCodes() {
    // 모델 제안 코드 뒤에 검토자가 추가한 코드를 붙인다.
    var out = [];
    state.ex.codes.forEach(function (c) { out.push({ code: c.code, title: c.title, item_ids: c.item_ids || [], evidence: c.evidence || [], origin: 'model' }); });
    state.added.forEach(function (a) { out.push({ code: a.code, title: a.title, item_ids: a.item_ids || [], evidence: [], origin: 'reviewer' }); });
    return out;
  }
  function codeEntry(code) {
    var list = allCodes();
    for (var i = 0; i < list.length; i++) { if (list[i].code === code) { return list[i]; } }
    return null;
  }
  function decisionOf(code) { return state.decisions[code] || 'pending'; }

  function activeRefs() {
    var refs = {};
    var a = state.active;
    if (!a) { return refs; }
    if (a.type === 'code') {
      refs['code:' + a.id] = true;
      var entry = codeEntry(a.id);
      if (entry) { entry.item_ids.forEach(function (q) { refs['item:' + q] = true; }); }
    } else {
      refs['item:' + a.id] = true;
    }
    return refs;
  }

  // ---------- 노트 ----------
  function evidenceSpans() {
    var spans = [];
    state.ex.items.forEach(function (it) {
      (it.evidence || []).forEach(function (ev) {
        if (ev.linked) { spans.push({ start: ev.start, end: ev.end, ref: 'item:' + it.id }); }
      });
    });
    state.ex.codes.forEach(function (c) {
      (c.evidence || []).forEach(function (ev) {
        if (ev.linked) { spans.push({ start: ev.start, end: ev.end, ref: 'code:' + c.code }); }
      });
    });
    return spans;
  }
  function renderNote() {
    var text = state.ex.note;
    var spans = evidenceSpans();
    var cuts = {};
    cuts[0] = true; cuts[text.length] = true;
    spans.forEach(function (s) { cuts[s.start] = true; cuts[s.end] = true; });
    var pts = Object.keys(cuts).map(Number).sort(function (x, y) { return x - y; });
    var body = $('note-body');
    body.textContent = '';
    for (var i = 0; i < pts.length - 1; i++) {
      var a = pts[i], b = pts[i + 1];
      if (b <= a) { continue; }
      var refs = [];
      for (var j = 0; j < spans.length; j++) {
        if (spans[j].start <= a && spans[j].end >= b && refs.indexOf(spans[j].ref) === -1) { refs.push(spans[j].ref); }
      }
      var piece = text.slice(a, b);
      if (!refs.length) {
        body.appendChild(document.createTextNode(piece));
      } else {
        var m = el('mark', 'ev', piece);
        m.setAttribute('data-refs', refs.join(' '));
        m.setAttribute('data-start', String(a));
        m.setAttribute('role', 'button');
        m.tabIndex = 0;
        body.appendChild(m);
      }
    }
    paintNote();
  }
  function paintNote() {
    var refs = activeRefs();
    var hasActive = !!state.active;
    var marks = $('note-body').querySelectorAll('mark.ev');
    for (var i = 0; i < marks.length; i++) {
      var list = (marks[i].getAttribute('data-refs') || '').split(' ');
      var on = false;
      for (var j = 0; j < list.length; j++) { if (refs[list[j]]) { on = true; break; } }
      marks[i].classList.toggle('on', on);
      marks[i].classList.toggle('dim', hasActive && !on);
    }
  }
  function scrollNoteTo(start) {
    var marks = $('note-body').querySelectorAll('mark.ev');
    for (var i = 0; i < marks.length; i++) {
      if (Number(marks[i].getAttribute('data-start')) >= start) {
        marks[i].scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
        return;
      }
    }
  }
  function scrollNoteToActive() {
    var first = $('note-body').querySelector('mark.ev.on');
    if (first) { first.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
  }
  function onMarkActivate(mark) {
    var list = (mark.getAttribute('data-refs') || '').split(' ');
    var target = null;
    for (var i = 0; i < list.length; i++) { if (list[i].indexOf('code:') === 0) { target = { type: 'code', id: list[i].slice(5) }; break; } }
    if (!target && list.length) { target = { type: 'item', id: list[0].slice(5) }; }
    if (!target) { return; }
    setView(target.type === 'code' ? 'codes' : 'items');
    setActive(target, false);
    var card = document.querySelector('[data-card="' + target.type + ':' + cssEscape(target.id) + '"]');
    if (card) { card.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
  }
  function cssEscape(s) { return String(s).replace(/["\\]/g, '\\$&'); }

  // ---------- 근거 인용 ----------
  function quoteNode(ev) {
    var q;
    if (ev.linked) {
      q = el('button', 'quote');
      q.type = 'button';
      q.addEventListener('click', function (e) { e.stopPropagation(); scrollNoteTo(ev.start); });
    } else {
      q = el('div', 'quote unlinked');
    }
    q.appendChild(el('span', 'quote-text', '“' + ev.quote + '”'));
    q.appendChild(el('span', ev.linked ? 'chip' : 'chip warn', ev.linked ? '원문 연결' : '원문에서 찾지 못함'));
    return q;
  }

  // ---------- 제안 코드 ----------
  function renderCodes() {
    var view = $('view-codes');
    view.textContent = '';
    var list = allCodes();
    if (!list.length) { view.appendChild(el('p', 'meta', '제안된 코드가 없습니다.')); return; }
    list.forEach(function (c) { view.appendChild(codeCard(c)); });
  }
  function codeCard(c) {
    var d = decisionOf(c.code);
    var isActive = state.active && state.active.type === 'code' && state.active.id === c.code;
    var card = el('article', 'card' + (d !== 'pending' ? ' ' + d : '') + (isActive ? ' active' : ''));
    card.setAttribute('data-card', 'code:' + c.code);

    var head = el('button', 'card-head');
    head.type = 'button';
    head.setAttribute('aria-label', c.code + ' ' + c.title + ' 근거 보기');
    head.appendChild(el('span', 'code', c.code));
    head.appendChild(el('span', 'code-title', c.title));
    head.appendChild(el('span', c.origin === 'model' ? 'chip' : 'chip ok', c.origin === 'model' ? '모델 제안' : '검토자 추가'));
    head.addEventListener('click', function () { setActive({ type: 'code', id: c.code }, true); });
    card.appendChild(head);

    var concepts = c.item_ids.map(function (q) { var it = itemById(q); return it ? it.concept : q; });
    if (concepts.length) {
      var meta = el('p', 'meta');
      meta.appendChild(document.createTextNode('추출 개념: '));
      meta.appendChild(el('b', null, concepts.join(', ')));
      card.appendChild(meta);
    }
    if (c.evidence.length) {
      var qs = el('div', 'quotes');
      c.evidence.forEach(function (ev) { qs.appendChild(quoteNode(ev)); });
      card.appendChild(qs);
    } else if (c.origin === 'reviewer') {
      card.appendChild(el('p', 'meta', '검토자가 후보 목록에서 고른 코드입니다. 근거는 해당 개념의 인용을 따릅니다.'));
    }

    var actions = el('div', 'actions');
    var acc = el('button', 'btn accept', '수락');
    acc.type = 'button';
    acc.setAttribute('aria-pressed', d === 'accepted' ? 'true' : 'false');
    acc.addEventListener('click', function () { decide(c.code, d === 'accepted' ? 'pending' : 'accepted'); });
    var rej = el('button', 'btn reject', '제외');
    rej.type = 'button';
    rej.setAttribute('aria-pressed', d === 'rejected' ? 'true' : 'false');
    rej.addEventListener('click', function () { decide(c.code, d === 'rejected' ? 'pending' : 'rejected'); });
    actions.appendChild(acc);
    actions.appendChild(rej);

    var nAlt = 0;
    c.item_ids.forEach(function (q) { var it = itemById(q); if (it) { nAlt += (it.candidates || []).length; } });
    if (nAlt) {
      var open = !!state.openAlt[c.code];
      var tog = el('button', 'btn link', open ? '후보 접기' : '다른 후보 보기 (' + nAlt + ')');
      tog.type = 'button';
      tog.setAttribute('aria-expanded', open ? 'true' : 'false');
      tog.addEventListener('click', function () { state.openAlt[c.code] = !open; renderCodes(); });
      actions.appendChild(tog);
    }
    if (c.origin === 'reviewer') {
      var rm = el('button', 'btn link', '추가 취소');
      rm.type = 'button';
      rm.addEventListener('click', function () { removeAdded(c.code); });
      actions.appendChild(rm);
    }
    card.appendChild(actions);

    if (state.openAlt[c.code]) {
      var alts = el('div', 'alts');
      c.item_ids.forEach(function (q) {
        var it = itemById(q);
        if (!it) { return; }
        alts.appendChild(el('p', 'alts-title', '“' + it.concept + '”의 후보 (검색어: ' + it.query + ')'));
        alts.appendChild(candList(it, c.code));
      });
      card.appendChild(alts);
    }
    return card;
  }
  function candList(it, currentCode) {
    var ul = el('ul', 'cand-list');
    (it.candidates || []).forEach(function (cand) {
      var present = !!codeEntry(cand.code);
      var li = el('li', 'cand' + (present ? ' picked' : ''));
      li.appendChild(el('span', 'rank', String(cand.rank)));
      li.appendChild(el('span', 'ccode', cand.code));
      li.appendChild(el('span', 'ctitle', cand.title));
      if (present) {
        li.appendChild(el('span', 'chip', cand.code === currentCode ? '이 코드' : '목록에 있음'));
      } else {
        var box = el('span', 'actions');
        var add = el('button', 'btn', '추가');
        add.type = 'button';
        add.setAttribute('aria-label', cand.code + ' 추가');
        add.addEventListener('click', function () { addCode(cand, it.id, null); });
        box.appendChild(add);
        if (currentCode) {
          var swap = el('button', 'btn', '교체');
          swap.type = 'button';
          swap.setAttribute('aria-label', currentCode + '를 ' + cand.code + '로 교체');
          swap.addEventListener('click', function () { addCode(cand, it.id, currentCode); });
          box.appendChild(swap);
        }
        li.appendChild(box);
      }
      ul.appendChild(li);
    });
    return ul;
  }

  // ---------- 추출 개념과 후보 ----------
  function renderItems() {
    var view = $('view-items');
    view.textContent = '';
    state.ex.items.forEach(function (it) {
      var isActive = state.active && state.active.type === 'item' && state.active.id === it.id;
      var card = el('article', 'card' + (isActive ? ' active' : ''));
      card.setAttribute('data-card', 'item:' + it.id);
      var head = el('button', 'card-head');
      head.type = 'button';
      head.appendChild(el('span', 'code', it.id));
      head.appendChild(el('span', 'code-title', it.concept));
      (it.tags || []).forEach(function (t) { head.appendChild(el('span', 'chip warn', TAG_LABEL[t] || t)); });
      head.addEventListener('click', function () { setActive({ type: 'item', id: it.id }, true); });
      card.appendChild(head);
      var meta = el('p', 'meta');
      meta.appendChild(document.createTextNode('검색어: '));
      meta.appendChild(el('b', null, it.query));
      card.appendChild(meta);
      if ((it.evidence || []).length) {
        var qs = el('div', 'quotes');
        it.evidence.forEach(function (ev) { qs.appendChild(quoteNode(ev)); });
        card.appendChild(qs);
      }
      if ((it.candidates || []).length) {
        var alts = el('div', 'alts');
        alts.appendChild(el('p', 'alts-title', '후보 ' + it.candidates.length + '개 (재순위 점수 순)'));
        alts.appendChild(candList(it, null));
        card.appendChild(alts);
      }
      view.appendChild(card);
    });
  }

  // ---------- 요약 ----------
  function renderStages() {
    var ex = state.ex;
    var itemQuotes = 0, itemLinked = 0, candTotal = 0, distinct = {}, codeQuotes = 0, codeLinked = 0, perItem = 0;
    ex.items.forEach(function (it) {
      (it.evidence || []).forEach(function (ev) { itemQuotes++; if (ev.linked) { itemLinked++; } });
      var n = (it.candidates || []).length;
      candTotal += n;
      if (n > perItem) { perItem = n; }
      (it.candidates || []).forEach(function (c) { distinct[c.code] = true; });
    });
    ex.codes.forEach(function (c) {
      (c.evidence || []).forEach(function (ev) { codeQuotes++; if (ev.linked) { codeLinked++; } });
    });
    var rows = [
      ['1단계 · 개념 추출', '개념 ' + ex.items.length + '개', '인용 ' + itemQuotes + '개 중 ' + itemLinked + '개가 원문에 연결됨'],
      ['2단계 · 후보 검색', '후보 ' + Object.keys(distinct).length + '개', '개념마다 최대 ' + perItem + '개, 전체 코드 공간에서 검색'],
      ['3단계 · 코드 선택', '제안 코드 ' + ex.codes.length + '개', '인용 ' + codeQuotes + '개 중 ' + codeLinked + '개가 원문에 연결됨']
    ];
    var ol = $('stages');
    ol.textContent = '';
    rows.forEach(function (r) {
      var li = el('li', 'stage');
      li.appendChild(el('span', 'stage-name', r[0]));
      li.appendChild(el('span', 'stage-main', r[1]));
      li.appendChild(el('span', 'stage-sub', r[2]));
      ol.appendChild(li);
    });
  }
  function renderCounts() {
    var acc = 0, rej = 0, pen = 0;
    allCodes().forEach(function (c) {
      var d = decisionOf(c.code);
      if (d === 'accepted') { acc++; } else if (d === 'rejected') { rej++; } else { pen++; }
    });
    var box = $('counts');
    box.textContent = '';
    box.appendChild(el('span', 'chip ok', '수락 ' + acc));
    box.appendChild(el('span', 'chip no', '제외 ' + rej));
    box.appendChild(el('span', 'chip', '미검토 ' + pen));
  }

  // ---------- 동작 ----------
  function setActive(target, scrollNote) {
    var same = state.active && target && state.active.type === target.type && state.active.id === target.id;
    state.active = same && scrollNote ? null : target;
    renderCodes();
    renderItems();
    paintNote();
    if (state.active && scrollNote) { scrollNoteToActive(); }
  }
  function decide(code, value) {
    if (value === 'pending') { delete state.decisions[code]; } else { state.decisions[code] = value; }
    save();
    renderCodes();
    renderCounts();
  }
  function addCode(cand, itemId, replaceCode) {
    if (!codeEntry(cand.code)) {
      state.added.push({ code: cand.code, title: cand.title, item_ids: [itemId] });
      state.decisions[cand.code] = 'accepted';
    }
    if (replaceCode) { state.decisions[replaceCode] = 'rejected'; }
    save();
    renderCodes();
    renderItems();
    renderCounts();
  }
  function removeAdded(code) {
    state.added = state.added.filter(function (a) { return a.code !== code; });
    delete state.decisions[code];
    delete state.openAlt[code];
    if (state.active && state.active.type === 'code' && state.active.id === code) { state.active = null; }
    save();
    renderCodes();
    renderItems();
    renderCounts();
    paintNote();
  }
  function setView(name) {
    state.view = name;
    var codes = name === 'codes';
    $('view-codes').hidden = !codes;
    $('view-items').hidden = codes;
    $('tab-codes').setAttribute('aria-selected', codes ? 'true' : 'false');
    $('tab-items').setAttribute('aria-selected', codes ? 'false' : 'true');
  }
  function copyText() {
    var lines = [];
    allCodes().forEach(function (c) { if (decisionOf(c.code) === 'accepted') { lines.push(c.code + '\t' + c.title); } });
    return lines.join('\n');
  }
  function onCopy() {
    var text = copyText();
    var status = $('copy-status');
    var fb = $('copy-fallback');
    if (!text) { status.textContent = '수락한 코드가 없습니다.'; return; }
    function fallback() {
      fb.hidden = false;
      fb.value = text;
      fb.focus();
      fb.select();
      status.textContent = '아래 목록을 직접 복사하세요.';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        fb.hidden = true;
        status.textContent = '수락한 코드 ' + text.split('\n').length + '개를 복사했습니다.';
      }, fallback);
    } else {
      fallback();
    }
  }
  function onReset() {
    state.decisions = {};
    state.added = [];
    state.openAlt = {};
    state.active = null;
    $('copy-status').textContent = '';
    $('copy-fallback').hidden = true;
    save();
    renderAll();
  }

  function renderAll() {
    renderStages();
    renderNote();
    renderCodes();
    renderItems();
    renderCounts();
  }
  function loadExample(idx) {
    state.ex = EXAMPLES[idx];
    state.active = null;
    state.decisions = {};
    state.added = [];
    state.openAlt = {};
    load();
    var ex = state.ex;
    $('note-title').textContent = ex.title || '노트';
    $('note-source').textContent = ex.source && ex.source.label ? ex.source.label : '';
    $('mock-banner').hidden = ex.output_kind !== 'mock';
    var exButtons = $('example-buttons').querySelectorAll('.ex-btn');
    for (var bi = 0; bi < exButtons.length; bi++) {
      exButtons[bi].setAttribute('aria-pressed', Number(exButtons[bi].getAttribute('data-example')) === idx ? 'true' : 'false');
    }
    var foot = $('foot');
    foot.textContent = '';
    if (ex.source && ex.source.citation) {
      foot.appendChild(document.createTextNode('노트 출처: ' + ex.source.citation + ' '));
      if (ex.source.url) {
        var a = el('a', null, ex.source.url);
        a.href = ex.source.url;
        a.target = '_blank';
        a.rel = 'noopener';
        foot.appendChild(a);
      }
    }
    if (ex.catalog) { foot.appendChild(document.createTextNode(' · 코드 제목: ' + ex.catalog)); }
    $('copy-status').textContent = '';
    $('copy-fallback').hidden = true;
    setView('codes');
    renderAll();
  }

  function start() {
    var box = $('example-buttons');
    if (!EXAMPLES.length) {
      $('view-codes').appendChild(el('p', 'meta', '표시할 예시가 없습니다.'));
      return;
    }
    EXAMPLES.forEach(function (ex, i) {
      // 제목의 괄호 안 이름(예: ACI-BENCH D2N004)을 버튼 이름으로 쓴다.
      var m = /\(([^)]+)\)/.exec(ex.title || '');
      var b = el('button', 'ex-btn', m ? m[1] : (ex.title || ex.id));
      b.type = 'button';
      b.setAttribute('data-example', String(i));
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function () { loadExample(i); });
      box.appendChild(b);
    });
    $('tab-codes').addEventListener('click', function () { setView('codes'); });
    $('tab-items').addEventListener('click', function () { setView('items'); });
    $('copy-btn').addEventListener('click', onCopy);
    $('reset-btn').addEventListener('click', onReset);
    $('note-body').addEventListener('click', function (e) {
      var m = e.target && e.target.closest ? e.target.closest('mark.ev') : null;
      if (m) { onMarkActivate(m); }
    });
    $('note-body').addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.matches && e.target.matches('mark.ev')) {
        e.preventDefault();
        onMarkActivate(e.target);
      }
    });
    loadExample(0);
  }
  start();
})();
</script>

</body>
</html>
